[project]
name = "click-to-do-linux"
version = "0.3.1"
description = "Personal Linux workbench with Pomodoro, wellness reminders, daily notes, tasks, and local AI screen tools"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["wayland", "office", "productivity", "pomodoro", "wellbeing", "notes", "ocr", "ollama", "vietnamese", "click-to-do"]
readme = "README.md"
authors = [
    { name = "thanhnndev", email = "contact@thanhnn.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyqt6>=6.11.0",
    "onnxruntime>=1.20",
    "rapidocr>=3.9.2",
    "rembg>=2.0.85",
    "requests>=2.34.2",
    "pyqt6-fluent-widgets[full]>=1.11.3",
]

[project.urls]
Homepage = "https://github.com/thanhnndev/click-to-do-linux"
Issues = "https://github.com/thanhnndev/click-to-do-linux/issues"

[project.scripts]
click-to-do = "click_to_do_linux:main"
click-to-do-linux = "click_to_do_linux:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.14.0"]
build-backend = "uv_build"
